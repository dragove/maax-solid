appId: app.maax.desktop
productName: Maax
copyright: Copyright © 2026 Maax
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - LICENSE
  - NOTICE
  - "!**/*.map"
asar: true
asarUnpack:
  - node_modules/koffi/**/*
  - node_modules/@koromix/**/*
npmRebuild: false
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Development
  executableName: maax
  icon: build/icon.png
  maintainer: Maax
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  icon: build/icon.png
win:
  target:
    - nsis
  icon: build/icon.png
