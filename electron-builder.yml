# The static runtime + zstd AppImage starts roughly 1.3s faster than the
# legacy FUSE2/gzip toolset; see docs/startup-benchmark.md.
toolsets:
  appimage: "1.0.3"
appImage:
  compression: zstd
appId: app.maax.desktop
productName: Maax
copyright: Copyright © 2026 Maax
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - LICENSE
  - NOTICE
  - "!**/*.map"
# MaaX only ships Chinese and English UI; the other Chromium locales add
# roughly 9 MB to the installed tree and about 1.5 MB to each compressed package.
electronLanguages:
  - en-US
  - zh-CN
asar: true
asarUnpack:
  - node_modules/koffi/**/*
  - node_modules/@koromix/**/*
npmRebuild: false
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
linux:
  # Installable formats only. The release tarball is `tar | zstd` from
  # scripts/archive-linux.mjs: electron-builder's tar targets re-archive the
  # whole tree with single-threaded 7-Zip (-mx=9 costs ~146 s for our 272 MB
  # tree), while zstd archives it in about a second.
  target:
    - AppImage
    - deb
  category: Development
  executableName: maax
  icon: build/icon.png
  maintainer: Maax
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  icon: build/icon.png
win:
  target:
    - nsis
  icon: build/icon.png
